name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Package plugin
        run: |
          mkdir release
          cp md-to-docx/main.js release/
          cp md-to-docx/manifest.json release/
          cp md-to-docx/styles.css release/
          cd release && zip -r ../md-to-docx.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            md-to-docx/main.js
            md-to-docx/manifest.json
            md-to-docx/styles.css
            md-to-docx.zip
          generate_release_notes: true
